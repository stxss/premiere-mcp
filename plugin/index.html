<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: sans-serif; font-size: 12px; color: #ddd; background: transparent; margin: 8px; }
    .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    #dot { width: 10px; height: 10px; border-radius: 50%; background: #c33; flex: none; }
    #dot.on { background: #3c6; }
    #dot.wait { background: #d93; }
    input { width: 70px; }
    #token { width: 120px; }
    #log { height: 220px; overflow-y: auto; font-family: monospace; font-size: 11px;
           background: rgba(0,0,0,0.25); padding: 4px; white-space: pre-wrap; }
    .err { color: #f77; }
    .ok { color: #8d8; }
  </style>
</head>
<body>
  <div class="row"><div id="dot"></div><span id="status">Disconnected</span></div>
  <div class="row">
    <label>Port</label><input id="port" type="text" value="8765" />
    <label>Token</label><input id="token" type="text" placeholder="optional" />
  </div>
  <div class="row">
    <sp-button id="connect" size="s">Reconnect</sp-button>
    <sp-checkbox id="auto" checked>Auto-connect</sp-checkbox>
  </div>
  <div id="log"></div>
  <script src="main.js"></script>
</body>
</html>
